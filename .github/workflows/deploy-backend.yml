name: Deploy backend

on:
  workflow_run:
    workflows: [EasyCart CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, qa, prod]
        default: dev
        required: true
      ci_run_id:
        description: Successful main-branch EasyCart CI run ID to deploy or promote
        type: string
        required: true

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: deploy-backend-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.ENABLE_DEV_DEPLOY == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: resolve
        run: node scripts/ci/resolve-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
          TARGET_ENV: ${{ inputs.environment || 'dev' }}
          AUTO_DEPLOY: ${{ github.event_name == 'workflow_run' }}

  integration:
    if: needs.release.outputs.sha != ''
    needs: release
    uses: ./.github/workflows/backend-integration.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
    secrets: inherit

  deploy:
    needs: [release, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.release.outputs.environment }}
      url: ${{ vars.BACKEND_URL }}
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      TARGET_ENV: ${{ needs.release.outputs.environment }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      CI_RUN_ID: ${{ needs.release.outputs.run_id }}
      DEPLOYMENT_ENABLED: ${{ vars.DEPLOYMENT_ENABLED }}
      SUPABASE_AUTH_MIGRATED: ${{ vars.SUPABASE_AUTH_MIGRATED }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Validate environment and prepare secrets
        run: node scripts/ci/write-worker-secrets.mjs
      - run: npm ci
        working-directory: backend
      - uses: actions/download-artifact@v4
        with:
          name: backend-worker-${{ needs.release.outputs.sha }}
          path: backend/.worker-build
          run-id: ${{ needs.release.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Deploy the tested bundle
        id: deploy
        working-directory: backend
        run: node_modules/.bin/wrangler deploy .worker-build/worker-entry.js --no-bundle --env "$TARGET_ENV" --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Check deployed health
        id: health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 20 "$BACKEND_URL/api/health"
      - name: Record promotion result
        if: always() && steps.deploy.outcome != 'skipped'
        run: node scripts/ci/record-deployment.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome == 'success' && steps.health.outcome == 'success' && 'success' || 'failure' }}
      - name: Remove temporary credentials
        if: always()
        run: node -e 'require("fs").rmSync(require("path").join(process.env.RUNNER_TEMP, "worker-secrets.json"), {force:true})'
