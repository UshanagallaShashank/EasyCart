name: EasyCart CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      mobile: ${{ steps.paths.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker://rhysd/actionlint:1.7.12
      - run: node --test scripts/ci/*.test.mjs
      - id: paths
        run: node scripts/ci/changed-components.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-ci.yml

  required:
    name: CI
    if: always()
    needs: [changes, frontend, backend, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (jobs.changes.result !== "success" || Object.values(jobs).some(job => !["success", "skipped"].includes(job.result))) process.exit(1);'
