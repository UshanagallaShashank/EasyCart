name: EasyCart Backend CI

on:
push:
branches:
- main
- "feature/"
- "fix/"
paths:
- "backend/**"
- ".github/workflows/backend-ci.yml"

pull_request:
branches:
- main
paths:
- "backend/**"
- ".github/workflows/backend-ci.yml"

workflow_dispatch:

permissions:
contents: read

jobs:
test:
name: Backend Tests
runs-on: ubuntu-latest

defaults:
  run:
    working-directory: backend

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm
      cache-dependency-path: backend/package-lock.json

  - name: Install dependencies
    run: npm ci

  - name: Run backend tests
    run: npm test